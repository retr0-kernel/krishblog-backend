# GitLab CI for the Go API (Railway).
#
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   DATABASE_URL          — Neon Postgres URL (migrate job only)
#   RAILWAY_TOKEN         — optional; triggers `railway up` on main
#   RAILWAY_SERVICE       — optional Railway service name/id
#
# Railway/Vercel can also deploy from GitLab directly; the deploy job is a fallback
# when you prefer pushing from CI instead of a Git integration.

stages:
  - test
  - migrate
  - deploy

variables:
  GO_VERSION: "1.25"
  CGO_ENABLED: "0"

.go-job:
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - go mod download
    - go install entgo.io/ent/cmd/ent@latest
    - ent generate ./ent/schema

test:
  extends: .go-job
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
  script:
    - go vet ./...
    - go test ./...
    - go build -o /dev/null ./cmd/server
    - go build -o /dev/null ./cmd/migrate

migrate:
  extends: .go-job
  stage: migrate
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DATABASE_URL
      changes:
        - internal/database/**/*
        - internal/analytics/repository.go
        - ent/schema/**/*
        - cmd/migrate/**/*
    - when: never
  script:
    - go run ./cmd/migrate

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: test
    - job: migrate
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RAILWAY_TOKEN
    - when: never
  before_script:
    - apk add --no-cache curl bash
    - curl -fsSL https://railway.app/install.sh | sh
    - export PATH="$HOME/.railway/bin:$PATH"
  script:
    - |
      if [ -n "$RAILWAY_SERVICE" ]; then
        railway up --detach --service "$RAILWAY_SERVICE"
      else
        railway up --detach
      fi
